[project]
name = "sketch-to-form-api"
version = "0.1.0"
description = "FastAPI service for the Sketch-to-Form Builder (sketch -> LangGraph -> form definition)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.27.0",
    "supabase>=2.9.0",
    "pillow>=11.0.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-openai>=0.2.10",
    "openai>=1.55.0",
    "azure-ai-inference>=1.0.0b9",
    "mangum>=0.19.0",
    "boto3>=1.35.0",
]

[tool.uv]
package = false
